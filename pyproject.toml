[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdcap"
version = "1.0.0"
description = "Capitalisation of R&D data: Word/Excel extraction, normalization, SQL database, quality checks, interface"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Youssef Tafoughalti" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdcap = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E702"]
